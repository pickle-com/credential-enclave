# The release statement of a `v*` tag, attested by the job that built it (enclave.md 11.2). A
# workflow that the push of a `v*` tag starts calls this workflow at one fixed commit.
#
# The job takes nothing from its caller: no input and no secret. It checks out the commit that
# started the run, builds the enclave image file of that commit with `build/build.sh eif`, and
# attests `out/measurements.json` as the predicate of the release statement (protocol.md
# section 9), in the same job.
#
# The files of the build method are fixed in this file by their SHA-256: `build/build.sh`, the
# two Dockerfiles it builds from, and `rust-toolchain.toml`. The job fails when one of them is
# another file in the commit it builds. They are the files of the commit that decide what runs
# outside the compilation and what reaches the network: `build.sh` runs on the runner, the two
# Dockerfiles name the images, the packages and the steps of the build, among them the one step
# of `Dockerfile.enclave` that has a network (`cargo fetch --locked`), and `rust-toolchain.toml`
# names the toolchain that step runs. Everything else of the commit is read by that step as
# data, or runs in the step that compiles, which has no network. The job also fails when
# `Cargo.lock` names a package from another place than crates.io: the step with the network
# downloads what `Cargo.lock` names.
#
# So the measurements this job attests are those of the node program that the fixed build method
# makes of three things: the commit of the tag, the packages of crates.io that its `Cargo.lock`
# names by checksum, and the images and packages the fixed files name by digest and version.
# No program of the commit runs with a network, and no step of this job takes a value of the
# statement from the commit: `build.sh` reads the measurements from the enclave image file it
# built, and the job checks the release and the commit of the statement against the run.
#
# The certificate of the attestation states this file at the fixed commit as what signed (the
# Build Signer URI and the Build Signer Digest), and the repository, the tag and the commit of
# the tag as what the run was based on (the Source Repository URI, Ref and Digest). A change of
# this file, or of a file of the build method, is another commit of this file, which a verifier
# that fixed the commit of this file does not accept.
name: release-statement-build

on:
  workflow_call:
    outputs:
      bundle:
        description: The Sigstore bundle of the attestation as one line of JSON, or the empty string when the job could not read it.
        value: ${{ jobs.statement.outputs.bundle }}

permissions: {}

jobs:
  statement:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      bundle: ${{ steps.bundle.outputs.bundle }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: The run is the push of a tag, and the build method of its commit is the fixed one
        shell: bash
        run: |
          set -u
          # The push of a `v*` tag, and the checkout is the commit of that tag.
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          [[ "$GITHUB_REF_NAME" =~ ^v[A-Za-z0-9._-]+$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

          # A file of the build method: a regular file of the commit whose bytes, in the commit
          # and in the checkout, have the SHA-256 this file states.
          fixed() {
            local mode
            mode="$(git ls-tree "$GITHUB_SHA" -- "$2" | cut -d' ' -f1)"
            [[ "$mode" =~ ^100(644|755)$ ]] || { echo "::error::$2 is not a regular file of the commit"; exit 1; }
            test "$(git cat-file blob "$GITHUB_SHA:$2" | sha256sum | cut -d' ' -f1)" = "$1" ||
              { echo "::error::$2 of the commit is not the file of the fixed build method"; exit 1; }
            test "$(sha256sum < "$2" | cut -d' ' -f1)" = "$1" ||
              { echo "::error::$2 of the checkout is not the file of the fixed build method"; exit 1; }
          }
          fixed 1b82480c20d601bcdb28000dd0e1cbe348f6cf0d646ecfa0c6c80f55e6ce826e build/build.sh
          fixed 1d1f07ce67b1e92f7a13bf0364659b1996504640497cefe4eca12b3f54bf6498 build/Dockerfile.enclave
          fixed 2f0e73b8cfef1397dcf56f5d9271c28e7b3b89495e84d496c15dfcfa6241cd8a build/Dockerfile.eif
          fixed 0bf007546885bfdc84484863a3b2dd936a89627191998d987cd798759e3935f1 rust-toolchain.toml

          # Every package of Cargo.lock comes from crates.io, in the commit and in the checkout.
          from_crates_io() {
            awk '/^source = / && $0 != "source = \"registry+https://github.com/rust-lang/crates.io-index\"" { other = 1; print } END { exit other }'
          }
          git cat-file blob "$GITHUB_SHA:Cargo.lock" | from_crates_io ||
            { echo "::error::Cargo.lock of the commit names a package from another place than crates.io"; exit 1; }
          from_crates_io < Cargo.lock ||
            { echo "::error::Cargo.lock of the checkout names a package from another place than crates.io"; exit 1; }

          # build.sh names the release after the `v*` tag of the commit. The checkout holds no
          # tag: the pushed tag is set on the commit, and it is the only `v*` tag there.
          git tag --force "$GITHUB_REF_NAME" "$GITHUB_SHA"
          test "$(git tag --list --points-at HEAD 'v*')" = "$GITHUB_REF_NAME"
      - name: Build the enclave image file
        shell: bash
        run: build/build.sh eif
      - name: The statement names the pushed tag and its commit
        shell: bash
        run: |
          set -u
          test "$(jq -er .release out/measurements.json)" = "$GITHUB_REF_NAME"
          test "$(jq -er .git_commit out/measurements.json)" = "$GITHUB_SHA"
          cat out/measurements.json
      - name: Attest the release statement
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: out/enclave.eif
          predicate-type: https://pickle.com/credential-enclave/release/v1
          predicate-path: out/measurements.json
      # The bundle is handed to the caller as an output and kept as an artifact of the run. The
      # attestation is made by then: a failure of these two steps does not fail the job.
      - name: The bundle of the attestation
        id: bundle
        continue-on-error: true
        shell: bash
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -u
          bundle="$(jq --compact-output . "$BUNDLE_PATH")"
          test "$(printf '%s\n' "$bundle" | wc -l)" -eq 1
          printf '%s\n' "$bundle" > release-statement-build.sigstore.json
          printf 'bundle=%s\n' "$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        continue-on-error: true
        with:
          name: release-statement-build
          path: |
            release-statement-build.sigstore.json
            out/measurements.json
          if-no-files-found: error
