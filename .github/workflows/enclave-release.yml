# The release statement of a `v*` tag, attested by the job that built it (enclave.md 11.2). The
# workflow release-statement-build.yml, at the commit fixed below, builds the enclave image file
# of the commit of the tag with the build method that commit fixes and attests its
# measurements, and the bundle of that attestation is attached to the GitHub release of the tag
# as release-statement-build.sigstore.json.
#
# This file is apart from release.yml, which the same push starts: a run of this file that does
# not start, or that fails, leaves the release of the tag and its two attestations as that
# workflow makes them.
name: enclave-release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: enclave-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The commit after the @ is the commit of release-statement-build.yml that a verifier fixes:
  # the certificate of the attestation states it as the Build Signer Digest. The permissions are
  # the ones the job of that workflow asks for.
  statement:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: pickle-com/credential-enclave/.github/workflows/release-statement-build.yml@3e86688616915309ee409e2cdfae5261aa46fb99

  bundle:
    needs: statement
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUNDLE: ${{ needs.statement.outputs.bundle }}
    steps:
      - name: Attach the bundle of the attestation to the release of the tag
        shell: bash
        run: |
          set -u
          test -n "$BUNDLE"
          printf '%s\n' "$BUNDLE" > release-statement-build.sigstore.json
          # The release of the tag is made by release.yml, after its checks and its two builds:
          # wait for it, forty minutes at most.
          for attempt in $(seq 1 240); do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            sleep 10
          done
          gh release upload "$TAG" --clobber release-statement-build.sigstore.json
