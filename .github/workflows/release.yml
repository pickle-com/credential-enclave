# The release of a `v*` tag (enclave.md 11.2).
#
# check:     the checks of check.yml and `cargo audit`.
# build:     the workflow enclave-build.yml, at the commit fixed below, builds the enclave image
#            file of the commit of the tag and attests its measurements as the predicate of the
#            release statement (protocol.md section 9). That attestation is the public build
#            proof of the release.
# rebuild:   the same procedure on another machine, without an attestation.
# publish:   the two builds gave the same measurements (without this there is no release), the
#            public build proof passes the checks of the secure program and of the node of this
#            commit, the host image goes to ghcr.io with the proof inside, and the GitHub
#            release gets the enclave image file, its measurements and the proof.
#
# The enclave image file of the release and of the host image is the one the job `build` made.
# A tag whose name holds `-rc.` is a release candidate: its GitHub release is a prerelease.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain of rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal \
            --component rustfmt --component clippy --no-self-update
          rustc --version
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: The committed test vectors are the output of the generator
        run: cargo run --locked -p credential-enclave-protocol --bin vectors -- --check
      - name: The functions that read a secret and the callers of the sinks are the listed ones
        run: scripts/secret-access.sh --check
      - name: No dependency of Cargo.lock has a security advisory
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit

  # The commit after the @ is the commit of enclave-build.yml whose job signs the attestation:
  # the certificate states it as the Build Signer Digest, and the secure program and the node
  # accept the commits of that file they list. The permissions are the ones that job asks for.
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: pickle-com/credential-enclave/.github/workflows/enclave-build.yml@3f84e8368fcdf1f89e42ca629670bfe0989b6f13

  rebuild:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the enclave image file
        run: build/build.sh --release "$GITHUB_REF_NAME" eif
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rebuild
          path: out/measurements.json
          if-no-files-found: error

  publish:
    needs: [check, build, rebuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      HOST_IMAGE: ghcr.io/${{ github.repository }}/host:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: enclave-build
          path: out
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rebuild
          path: rebuild
      - name: Both builds gave the same measurements
        run: |
          cat out/measurements.json
          if ! diff out/measurements.json rebuild/measurements.json; then
            echo "::error::the attested build and the rebuild differ: the build is not reproducible, or the procedure of this commit is not the one of the fixed commit of enclave-build.yml"
            exit 1
          fi
      # The public build proof as the node, the backend and the secure program carry it: the
      # bytes of the release statement and the bundle of its attestation (protocol.md section 9).
      - name: The public build proof of the release
        run: |
          set -euo pipefail
          statement="$(base64 --wrap=0 < out/measurements.json | tr '+/' '-_' | tr -d '=')"
          jq --compact-output --null-input --arg statement "$statement" \
            --slurpfile attestation out/release-statement.sigstore.json \
            '{statement: $statement, attestation: $attestation[0]}' > out/release-proofs.json
          test "$(wc -c < out/release-proofs.json)" -le 131072
      # A release whose proof the secure program or the node of this commit refuses is not
      # made. Each check runs when this commit holds its command.
      - name: The secure program and the node of this commit accept the proof
        run: |
          set -euo pipefail
          if [ -f secure-program/tests/prove.js ]; then
            node secure-program/tests/prove.js out/release-proofs.json
          else
            echo "this commit holds no secure-program/tests/prove.js"
          fi
          if grep -q '"release-proofs"' verify/src/arguments.rs 2>/dev/null; then
            cargo run --quiet --locked -p credential-enclave-verify -- release-proofs out/release-proofs.json
          else
            echo "the verifier of this commit has no command release-proofs"
          fi
      - name: Build the host image around the enclave image file of the job build
        run: build/build.sh host
      - name: Log in to ghcr.io
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Push the host image
        run: |
          docker tag "credential-enclave-host:$TAG" "$HOST_IMAGE"
          docker push "$HOST_IMAGE"
      - name: Create the GitHub release
        run: |
          {
            echo "The identity of this release is PCR0, PCR1 and PCR2:"
            echo
            echo '```json'
            cat out/measurements.json
            echo '```'
            echo
            echo "release-proofs.json is the public build proof of these measurements: the release statement and the Sigstore bundle of its attestation by the job of enclave-build.yml."
          } > notes.md
          prerelease=""
          case "$TAG" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag $prerelease --title "$TAG" --notes-file notes.md
          gh release upload "$TAG" --clobber out/enclave.eif out/measurements.json \
            out/release-statement.sigstore.json out/release-proofs.json
      - name: Export the published registry bytes for offline mirroring
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.7
          CRANE="$(go env GOPATH)/bin/crane"
          "$CRANE" digest "$HOST_IMAGE" > out/host-image.digest
          "$CRANE" pull --format=oci "$HOST_IMAGE" out/host-image
          tar -cf out/host-image.oci.tar -C out/host-image .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: host-registry-image
          path: |
            out/host-image.oci.tar
            out/host-image.digest
          if-no-files-found: error
          retention-days: 7
