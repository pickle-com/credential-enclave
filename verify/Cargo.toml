[package]
name = "credential-enclave-verify"
version = "1.3.0"
description = "Verifies the attestation of the running nodes of the credential enclave against the measurements of a build"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "credential-enclave-verify"
path = "src/main.rs"

[dependencies]
# The verification itself: reading and verifying Nitro attestation documents, bindings and
# local documents, and base64url. A node verifies a peer with the same code.
credential-enclave-protocol = { path = "../protocol" }
# The 32 random bytes of the nonce, from the random source of the operating system. The node
# program draws its random bytes on the local platform with the same crate.
getrandom = "0.2"
# The TLS of the HTTPS request, with the features the node program builds it with: the `ring`
# provider, TLS 1.2 and TLS 1.3.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Reads the response of the attestation route and `measurements.json`.
serde_json.workspace = true
# The HTTP/1.1 client of the one GET request: synchronous, no async runtime. It is built
# without its features. Its `tls` feature would turn on the `logging` feature of rustls, which
# rewrites the entry of rustls in `Cargo.lock`, a build input of the measured node program.
# `src/fetch.rs` hands it the rustls connection instead. Version 2 adds one package to
# `Cargo.lock` (itself): everything it depends on is a package the workspace already has.
ureq = { version = "2.12", default-features = false }
# The certificate authorities the HTTPS request trusts (the Mozilla root program), compiled
# into the tool. The node program trusts the same set.
webpki-roots = "0.26"
