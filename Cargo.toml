[workspace]
members = ["protocol", "enclave", "host", "verify"]
resolver = "3"

[workspace.package]
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pickle-com/credential-enclave"
publish = false

[workspace.dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = "1"

# enclave.md 11.1: the release profile is a build input of the measured binary.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
